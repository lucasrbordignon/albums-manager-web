name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            cd /var/www/albums-manager-web

            git pull origin main

            echo "Building new image..."
            docker build -t albums-frontend:new .

            echo "Starting new container on 8081..."
            docker rm -f albuns-web-new || true
            docker run -d \
              --name albuns-web-new \
              --restart unless-stopped \
              -p 8081:80 \
              albums-frontend:new

            echo "Waiting for healthcheck..."
            sleep 3
            curl -f http://127.0.0.1:8081

            echo "Switching containers..."
            docker rm -f albuns-web || true
            docker run -d \
              --name albuns-web \
              --restart unless-stopped \
              -p 8080:80 \
              albums-frontend:new

            docker rm -f albuns-web-new || true

            echo "Deploy completed successfully"
